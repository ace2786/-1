[project]
name = "lawfirm-core"
version = "0.1.0"
description = "Offline LLM-powered legal case analysis platform (GUI+CLI+MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "chromadb>=0.5",
    "mcp>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.1",
    "pydantic-settings>=2.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawfirm"]

[project.scripts]
lawfirm = "lawfirm.cli.main:app"